{% extends 'process/process_layout.html' %}

{% block process_content %}
<section class="panel" style="max-width: 420px;">
    <div class="panel-toolbar">
        <span class="panel-label">New folder</span>
        <a href="{{ url_for('files.file_manager', name=process.name, location=current_location) }}" class="btn btn-sm btn-outline-secondary">Cancel</a>
    </div>
    <div class="panel-body">
        <form action="{{ url_for('files.create_directory_file', name=process.name, location=current_location) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="directory_name" class="form-label">Name</label>
                <input type="text" class="form-control" id="directory_name" name="directory_name" required placeholder="src">
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Create</button>
        </form>
    </div>
</section>
{% endblock process_content %}
