{% extends 'process/process_layout.html' %}
{% block process_content %}
<section class="panel">
    <div class="panel-toolbar">
        <span class="panel-label">Edit · {{ file_name }}</span>
        <button id="save-button" class="btn btn-primary btn-sm">Save</button>
    </div>
    <div class="panel-body">
        <div class="mb-3">
            <label for="file_name" class="form-label">File name</label>
            <input type="text" class="form-control" id="file_name" name="file_name" value="{{ file_name }}" required>
        </div>
        <div id="editor" class="code-editor" style="height: 560px;"></div>
        {% if error %}
        <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
        {% endif %}
    </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-modelist.min.js"></script>
<script>
  var editor = ace.edit("editor", {
      theme: "ace/theme/tomorrow_night_bright",
  });

  var fileName = document.getElementById("file_name").value;
  var modelist = ace.require("ace/ext/modelist");
  var mode = modelist.getModeForPath(fileName).mode;
  editor.session.setMode(mode);

  var fileContent = {{ file_content|tojson }};
  if (fileContent) {
      editor.setValue(fileContent);
  }

  document.getElementById("save-button").addEventListener("click", function() {
      const btn = this;
      btn.disabled = true;
      let content = editor.getValue().replace(/\r\n|\r/g, "\n");

      fetch("{{ url_for('files.edit_file', name=process.name, file=file_path) }}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
              file_name: document.getElementById("file_name").value,
              file_code: content,
          })
      }).then(response => response.json())
        .then(data => {
            if (data.success) {
                showSuccess("File saved");
            } else {
                showError(data.error || "Failed to save file");
            }
        })
        .catch(error => {
            console.error("Fetch error:", error);
            showError("Failed to save file");
        })
        .finally(() => { btn.disabled = false; });
  });

  // Ctrl/Cmd+S
  document.addEventListener("keydown", function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
          e.preventDefault();
          document.getElementById("save-button").click();
      }
  });
</script>
{% endblock process_content %}
