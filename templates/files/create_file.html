{% extends 'process/process_layout.html' %}

{% block process_content %}
<section class="panel" style="max-width: 520px;">
    <div class="panel-toolbar">
        <span class="panel-label">New file</span>
        <a href="{{ url_for('files.file_manager', name=process.name, location=location) }}" class="btn btn-sm btn-outline-secondary">Cancel</a>
    </div>
    <div class="panel-body">
        <form action="{{ url_for('files.create_file', name=process.name, location=location) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="file_name" class="form-label">Name</label>
                <input type="text" class="form-control" id="file_name" name="file_name" required oninput="onFileNameChange()" placeholder="index.js">
            </div>
            <div class="mb-3">
                <label class="form-label">Contents</label>
                <div id="editor" class="code-editor" style="height: 360px;"></div>
                <textarea name="file_code" id="file_code" style="display: none;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Create</button>
        </form>
        {% if error %}
        <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
        {% endif %}
    </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-modelist.min.js"></script>
<script>
    var editor = ace.edit("editor", { theme: "ace/theme/tomorrow_night_bright" });
    var modelist = ace.require("ace/ext/modelist");

    function onFileNameChange() {
        var input = document.getElementById("file_name");
        input.value = input.value.replace(/[^a-zA-Z0-9_.-]/g, '');
        editor.session.setMode(modelist.getModeForPath(input.value).mode);
    }

    document.querySelector("form").addEventListener("submit", function() {
        document.getElementById("file_code").value = editor.getValue();
    });
</script>
{% endblock process_content %}
