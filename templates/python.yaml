id: python
name: Python
description: Run a Python app inside python:3.12
fields:
  - key: script
    label: Start command
    default: pip install -r requirements.txt && python main.py
services:
  - name: app
    image: python:3.12
    workdir: /app
    internalPort: 8000
    http: true
    logs: true
    shell: true
    volumes: [".:/app"]