{% extends 'process/process_layout.html' %}

{% block process_content %}
<div class="stack">
    <section class="panel">
        <div class="panel-toolbar">
            <span class="panel-label">New schedule</span>
        </div>
        <div class="panel-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Cron expression</label>
                    <input type="text" class="form-control" name="schedule"
                           placeholder="0 8 * * *" required>
                    <p class="form-hint">minute hour day month weekday · e.g. <code>0 8 * * *</code> daily at 08:00</p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Action</label>
                    <div class="choice-row">
                        <label class="choice">
                            <input id="action-start" type="radio" name="action" value="start" required>
                            <span>Start</span>
                        </label>
                        <label class="choice">
                            <input id="action-stop" type="radio" name="action" value="stop">
                            <span>Stop</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Schedule</button>
            </form>
        </div>
    </section>

    <section class="panel">
        <div class="panel-toolbar">
            <span class="panel-label">Active tasks</span>
        </div>
        <div class="table-responsive">
            <table class="table table-dense mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Schedule</th>
                        <th>Command</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="schedule-jobs-tbody">
                    <tr class="skeleton-row">
                        <td><div class="skeleton skeleton-text" style="width: 120px;"></div></td>
                        <td><div class="skeleton skeleton-text" style="width: 100px;"></div></td>
                        <td><div class="skeleton skeleton-text" style="width: 80px;"></div></td>
                        <td><div class="skeleton skeleton-button" style="width: 40px;"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<script>
const scheduleProcessName = "{{ process.name }}";

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

function renderScheduleJobs(jobs) {
    const tbody = document.getElementById('schedule-jobs-tbody');
    tbody.innerHTML = '';

    if (!jobs || jobs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-muted py-3">No scheduled tasks.</td></tr>`;
        return;
    }

    const fragment = document.createDocumentFragment();
    jobs.forEach((job) => {
        const tr = document.createElement('tr');

        const nameTd = document.createElement('td');
        nameTd.textContent = job.name || scheduleProcessName;

        const scheduleTd = document.createElement('td');
        const scheduleCode = document.createElement('code');
        scheduleCode.textContent = job.schedule || '';
        scheduleTd.appendChild(scheduleCode);

        const commandTd = document.createElement('td');
        commandTd.textContent = job.command || '';

        const actionTd = document.createElement('td');
        actionTd.className = 'text-end';
        const form = document.createElement('form');
        form.action = `/process/schedule/${encodeURIComponent(scheduleProcessName)}/delete`;
        form.method = 'POST';
        form.className = 'd-inline';

        const csrf = document.createElement('input');
        csrf.type = 'hidden';
        csrf.name = 'csrf_token';
        csrf.value = '{{ csrf_token() }}';

        const line = document.createElement('input');
        line.type = 'hidden';
        line.name = 'line';
        line.value = job.line || '';

        const btn = document.createElement('button');
        btn.type = 'submit';
        btn.className = 'btn btn-sm btn-outline-danger';
        btn.textContent = 'Delete';

        form.appendChild(csrf);
        form.appendChild(line);
        form.appendChild(btn);
        actionTd.appendChild(form);

        tr.appendChild(nameTd);
        tr.appendChild(scheduleTd);
        tr.appendChild(commandTd);
        tr.appendChild(actionTd);
        fragment.appendChild(tr);
    });

    tbody.appendChild(fragment);
}

async function loadScheduleJobs() {
    const tbody = document.getElementById('schedule-jobs-tbody');
    try {
        const response = await fetch(`/process/schedule/${encodeURIComponent(scheduleProcessName)}/api/jobs`);
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.error || 'Failed to load scheduled tasks');
        }
        renderScheduleJobs(data.jobs || []);
    } catch (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-danger py-3">${escapeHtml(error.message)}</td></tr>`;
    }
}

document.addEventListener('DOMContentLoaded', loadScheduleJobs);
</script>
{% endblock process_content %}
