{% extends 'process/process_layout.html' %}

{% block process_content %}
<div class="stack">
    <section class="panel">
        <div class="panel-toolbar">
            <span class="panel-label">Invite</span>
        </div>
        <div class="panel-body">
            <form action="{{ url_for('process.invite_subuser', name=process.name)}}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-grid">
                    <div>
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="user@example.com" required>
                    </div>
                    <div>
                        <label class="form-label">Permissions</label>
                        <select class="form-select" name="permissions" multiple required size="5">
                            <option value="console">Console</option>
                            <option value="settings">Settings</option>
                            <option value="file">Files</option>
                            <option value="nginx">Nginx</option>
                            <option value="git">Git</option>
                            <option value="schedule">Schedule</option>
                            <option value="sub_users">Access</option>
                            <option value="email">Email</option>
                        </select>
                        <p class="form-hint">Hold Ctrl/Cmd for multiple</p>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary btn-sm">Send invitation</button>
                </div>
            </form>
        </div>
    </section>

    <section class="panel">
        <div class="panel-toolbar">
            <span class="panel-label">Sub users</span>
        </div>
        <div class="table-responsive">
            <table class="table table-dense mb-0">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Permissions</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="subusers-tbody">
                    <tr class="skeleton-row">
                        <td><div class="skeleton skeleton-text" style="width: 220px;"></div></td>
                        <td><div class="skeleton skeleton-button" style="width: 180px;"></div></td>
                        <td><div class="skeleton skeleton-text" style="width: 80px;"></div></td>
                        <td><div class="skeleton skeleton-text" style="width: 90px;"></div></td>
                        <td><div class="skeleton skeleton-button" style="width: 40px;"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<script>
const subusersProcessName = "{{ process.name }}";

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

function formatCreatedDate(value) {
    if (!value) return '—';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '—';
    return date.toISOString().slice(0, 10);
}

function renderSubusers(users) {
    const tbody = document.getElementById('subusers-tbody');
    tbody.innerHTML = '';

    if (!users || users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-muted py-3">No sub users.</td></tr>`;
        return;
    }

    const fragment = document.createDocumentFragment();
    users.forEach((user) => {
        const tr = document.createElement('tr');

        const userTd = document.createElement('td');
        userTd.textContent = user.email || '';

        const permsTd = document.createElement('td');
        const permissions = Array.isArray(user.permissions) ? user.permissions : [];
        permsTd.textContent = permissions.length ? permissions.join(', ') : 'None';

        const roleTd = document.createElement('td');
        roleTd.textContent = user.sub_role || 'sub_user';

        const createdTd = document.createElement('td');
        createdTd.textContent = formatCreatedDate(user.created_at);

        const actionsTd = document.createElement('td');
        actionsTd.className = 'text-end';
        const form = document.createElement('form');
        form.action = `/process/subusers/${encodeURIComponent(subusersProcessName)}/delete/${user.id}`;
        form.method = 'POST';
        form.className = 'd-inline';
        form.onsubmit = () => confirm('Remove this user?');

        const csrf = document.createElement('input');
        csrf.type = 'hidden';
        csrf.name = 'csrf_token';
        csrf.value = '{{ csrf_token() }}';

        const btn = document.createElement('button');
        btn.type = 'submit';
        btn.className = 'btn btn-sm btn-outline-danger';
        btn.textContent = 'Remove';

        form.appendChild(csrf);
        form.appendChild(btn);
        actionsTd.appendChild(form);

        tr.appendChild(userTd);
        tr.appendChild(permsTd);
        tr.appendChild(roleTd);
        tr.appendChild(createdTd);
        tr.appendChild(actionsTd);
        fragment.appendChild(tr);
    });

    tbody.appendChild(fragment);
}

async function loadSubusers() {
    const tbody = document.getElementById('subusers-tbody');
    try {
        const response = await fetch(`/process/subusers/${encodeURIComponent(subusersProcessName)}/api/list`);
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.error || 'Failed to load sub users');
        }
        renderSubusers(data.users || []);
    } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger py-3">${escapeHtml(error.message)}</td></tr>`;
    }
}

document.addEventListener('DOMContentLoaded', loadSubusers);
</script>
{% endblock %}
