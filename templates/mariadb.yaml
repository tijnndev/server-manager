id: mariadb
name: MariaDB
description: MariaDB database server with a persistent volume
fields:
  - key: env:db:MARIADB_ROOT_PASSWORD
    label: Root password
    default: changeme
services:
  - name: db
    image: mariadb:11
    internalPort: 3306
    logs: true
    env:
      MARIADB_ROOT_PASSWORD: changeme
    volumes:
      - "db-data:/var/lib/mysql"
volumes:
  db-data: {}