id: build-vite
name: Vite build
description: Build a Vite app with Node 22 and serve the static output with httpd
dockerfile: |
  FROM node:22 AS build
  WORKDIR /app
  COPY package.json package-lock.json ./
  RUN npm install
  COPY . .
  RUN npm run build

  FROM httpd:alpine
  COPY --from=build /app/dist /usr/local/apache2/htdocs
services:
  - name: app
    build: true
    internalPort: 80
    http: true
    logs: true