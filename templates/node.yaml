id: node
name: Node.js
description: Node 22. The start script, shell and logs all use the same container, so npm is on PATH.
fields:
  - key: script:app
    label: Start script
    default: npm install && npm start
services:
  - name: app
    image: node:22
    workdir: /app
    script: npm install && npm start
    internalPort: 3000
    http: true
    logs: true
    shell: true
    volumes:
      - .:/app
    env:
      NODE_ENV: development
