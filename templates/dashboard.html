{% extends 'layout.html' %}

{% block content %}
<div class="page">
    <div class="page-head">
        <div>
            <h1 class="page-title">Processes</h1>
            <p class="page-subtitle">Managed containers on this host</p>
        </div>
        <div class="page-head-actions">
            <input type="text" id="search-bar" class="form-control form-control-sm search-input" placeholder="Filter…" oninput="filterProcesses()">
        </div>
    </div>

    <div class="layout-split">
        <section class="panel">
            <div class="table-responsive">
                <table class="table table-sticky-header table-dense">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name" onclick="handleSort('name')">ID <i class="bi sort-icon"></i></th>
                            <th class="sortable" data-sort="name" onclick="handleSort('name')">Name <i class="bi sort-icon"></i></th>
                            <th class="sortable" data-sort="type" onclick="handleSort('type')">Type <i class="bi sort-icon"></i></th>
                            <th class="sortable" data-sort="status" onclick="handleSort('status')">Status <i class="bi sort-icon"></i></th>
                            <th class="sortable" data-sort="cpu" onclick="handleSort('cpu')">CPU <i class="bi sort-icon"></i></th>
                            <th class="sortable" data-sort="memory" onclick="handleSort('memory')">Mem <i class="bi sort-icon"></i></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="process-grid">
                        <tr class="skeleton-row">
                            <td><div class="skeleton skeleton-text" style="width: 80px;"></div></td>
                            <td><div class="skeleton skeleton-text" style="width: 120px;"></div></td>
                            <td><div class="skeleton skeleton-text" style="width: 60px;"></div></td>
                            <td><div class="skeleton skeleton-text" style="width: 70px;"></div></td>
                            <td><div class="skeleton skeleton-text" style="width: 50px;"></div></td>
                            <td><div class="skeleton skeleton-text" style="width: 50px;"></div></td>
                            <td><div class="skeleton skeleton-button"></div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <aside class="panel panel-side">
            <div class="panel-label">Host</div>
            <div id="server-stats" class="stat-list">
                <div class="stat-row">
                    <span class="stat-key">CPU</span>
                    <span class="stat-val"><span id="cpu-usage">—</span>%</span>
                </div>
                <div class="progress progress-thin">
                    <div class="progress-bar" id="cpu-progress" style="width: 0%"></div>
                </div>
                <div class="stat-meta" id="cpu-name">—</div>

                <div class="stat-row">
                    <span class="stat-key">Memory</span>
                    <span class="stat-val"><span id="memory-used">—</span> / <span id="memory-allocated">—</span> MB</span>
                </div>
                <div class="progress progress-thin">
                    <div class="progress-bar bg-warning" id="memory-progress" style="width: 0%"></div>
                </div>

                <div class="stat-row">
                    <span class="stat-key">Storage</span>
                    <span class="stat-val"><span id="storage-used">—</span> / <span id="storage-allocated">—</span> GB</span>
                </div>
                <div class="progress progress-thin">
                    <div class="progress-bar bg-info" id="storage-progress" style="width: 0%"></div>
                </div>

                <div class="stat-row stat-row-last">
                    <span class="stat-key">Network</span>
                    <span class="stat-val"><span id="network-usage">—</span> MB/s</span>
                </div>
            </div>
        </aside>
    </div>
</div>
<script>

    let userSettings = null;
    let autoRefreshInterval = null;
    let sortState = { column: null, direction: 'asc' };

    // Fetch user settings on page load
    async function loadUserSettings() {
        try {
            const response = await fetch("{{ url_for('settings.get_preferences') }}");
            const data = await response.json();
            userSettings = data;

            // Setup auto-refresh if enabled
            if (userSettings.auto_refresh_enabled) {
                setupAutoRefresh(userSettings.auto_refresh_interval);
            }
        } catch (error) {
            console.error("Failed to load user settings:", error);
        }
    }

    function setupAutoRefresh(intervalSeconds) {
        // Clear any existing interval
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
        }

        // Set up new interval
        autoRefreshInterval = setInterval(() => {
            fetchProcesses();
            fetchServerStats();
        }, intervalSeconds * 1000);
    }

    async function fetchServerStats() {
        try {
            const response = await fetch("{{ url_for('get_server_stats') }}");
            if (!response.ok) {
                return;
            }
            const stats = await response.json();
        
            // Update CPU
            document.getElementById('cpu-name').textContent = stats.cpu_name;
            document.getElementById('cpu-usage').textContent = stats.cpu_usage;
            document.getElementById('cpu-progress').style.width = stats.cpu_usage + '%';
        
            // Update Memory 
            const memoryUsedMB = Math.round((stats.memory_usage / 100) * stats.memory_allocated);
            document.getElementById('memory-used').textContent = memoryUsedMB;
            document.getElementById('memory-allocated').textContent = stats.memory_allocated;
            document.getElementById('memory-progress').style.width = stats.memory_usage + '%';
        
            // Update Storage
            const storageUsedGB = Math.round((stats.storage_usage / 100) * stats.storage_allocated * 10) / 10;
            document.getElementById('storage-used').textContent = storageUsedGB;
            document.getElementById('storage-allocated').textContent = stats.storage_allocated;
            document.getElementById('storage-progress').style.width = stats.storage_usage + '%';
        
            // Update Network
            document.getElementById('network-usage').textContent = stats.network_usage;
        } catch (error) {
            console.error('Failed to fetch server stats:', error);
        }
    }
    fetchServerStats();

    function filterProcesses() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const processRows = document.querySelectorAll('[data-process-name]');
        processRows.forEach(row => {
            const processName = row.getAttribute('data-process-name').toLowerCase();
            row.style.display = processName.includes(query) ? '' : 'none';
        });
    }

    let allProcesses = {};
    let isInitialLoad = true;

    async function fetchProcesses() {
        let newProcesses;
        try {
            const response = await fetch("{{ url_for('process.get_process') }}");
            if (!response.ok) {
                return;
            }
            newProcesses = await response.json();
        } catch (error) {
            console.error('Failed to fetch processes:', error);
            return;
        }
        
        // Always preserve existing metrics when updating process data
        for (const [name, data] of Object.entries(newProcesses)) {
            if (allProcesses[name]) {
                // Preserve existing metrics before overwriting
                const existingMetrics = allProcesses[name].metrics;
                allProcesses[name] = { ...data };
                if (existingMetrics) {
                    allProcesses[name].metrics = existingMetrics;
                }
            } else {
                // New process, just add it
                allProcesses[name] = data;
            }
        }
        
        // Mark initial load as complete
        if (isInitialLoad && Object.keys(allProcesses).length > 0) {
            isInitialLoad = false;
        }

        applySortAndRender();
    }

    function getStatusBadgeClass(status) {
        const statusMap = {
            'running': 'bg-success',
            'exited': 'bg-secondary',
            'process stopped': 'bg-warning',
            'error': 'bg-danger',
            'restarting': 'bg-info'
        };
        return statusMap[status.toLowerCase()] || 'bg-secondary';
    }

    function renderProcesses(processEntries) {
        const grid = document.getElementById('process-grid');
        
        if (processEntries.length === 0) {
            if (!isInitialLoad) {
                grid.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-cell">No processes</td>
                    </tr>
                `;
            }
            return;
        }
        
        const rows = processEntries.map(([name, process]) => {
            const statusClass = getStatusBadgeClass(process.status);
            const cpuUsage = process.metrics?.cpu_percent || 0;
            const memUsage = process.metrics?.memory_mb || 0;
            const statusLabel = process.status.charAt(0).toUpperCase() + process.status.slice(1);
            
            return `
            <tr data-process-name="${name}">
                <td><code>${name.substring(0, 12)}</code></td>
                <td class="cell-name">${name}</td>
                <td><span class="badge bg-info">${process.type}</span></td>
                <td><span class="badge ${statusClass}">${statusLabel}</span></td>
                <td class="cell-muted">${cpuUsage}%</td>
                <td class="cell-muted">${memUsage} MB</td>
                <td class="cell-actions">
                    <a href="/process/console/${name}" class="btn btn-sm btn-outline-secondary">Open</a>
                </td>
            </tr>
            `;
        });

        grid.innerHTML = rows.join('');
        filterProcesses();
    }

    fetchProcesses();

    function handleSort(column) {
        if (sortState.column === column) {
            sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
        } else {
            sortState.column = column;
            sortState.direction = 'asc';
        }
        updateSortHeaders();
        applySortAndRender();
    }

    function updateSortHeaders() {
        document.querySelectorAll('th.sortable').forEach(th => {
            const icon = th.querySelector('.sort-icon');
            const col = th.getAttribute('data-sort');
            th.classList.remove('sort-asc', 'sort-desc');
            if (icon) {
                icon.className = 'bi sort-icon bi-arrow-down-up text-muted';
            }
            if (col === sortState.column && icon) {
                th.classList.add(sortState.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                icon.className = sortState.direction === 'asc'
                    ? 'bi sort-icon bi-arrow-up'
                    : 'bi sort-icon bi-arrow-down';
            }
        });
    }

    function sortEntries(entries) {
        if (!sortState.column) {
            return entries;
        }

        const direction = sortState.direction === 'asc' ? 1 : -1;

        return entries.sort((a, b) => {
            const [nameA, procA] = a;
            const [nameB, procB] = b;

            let valueA;
            let valueB;

            switch (sortState.column) {
                case 'name':
                    valueA = nameA.toLowerCase();
                    valueB = nameB.toLowerCase();
                    break;
                case 'type':
                    valueA = (procA.type || '').toLowerCase();
                    valueB = (procB.type || '').toLowerCase();
                    break;
                case 'status':
                    valueA = (procA.status || '').toLowerCase();
                    valueB = (procB.status || '').toLowerCase();
                    break;
                case 'cpu':
                    valueA = procA.metrics?.cpu_percent || 0;
                    valueB = procB.metrics?.cpu_percent || 0;
                    return (valueA - valueB) * direction;
                case 'memory':
                    valueA = procA.metrics?.memory_mb || 0;
                    valueB = procB.metrics?.memory_mb || 0;
                    return (valueA - valueB) * direction;
                default:
                    return 0;
            }

            return valueA.localeCompare(valueB) * direction;
        });
    }

    function applySortAndRender() {
        const entries = sortEntries(Object.entries(allProcesses));
        renderProcesses(entries);
    }

    // Load user settings when page loads
    loadUserSettings();

    // Fetch real-time metrics for all processes (batch - single API call)
    async function fetchProcessMetrics() {
        if (!allProcesses || Object.keys(allProcesses).length === 0) return;

        try {
            const response = await fetch('/process/all-metrics');
            if (!response.ok) {
                console.warn(`Failed to fetch batch metrics: ${response.status}`);
                return;
            }
            const allMetrics = await response.json();

            for (const [name, process] of Object.entries(allProcesses)) {
                if (allMetrics[name]) {
                    allProcesses[name].metrics = allMetrics[name];
                }
            }
        } catch (error) {
            console.error('Failed to fetch batch metrics:', error);
        }

        if (sortState.column === 'cpu' || sortState.column === 'memory') {
            applySortAndRender();
            return;
        }

        // Update metrics in-place without re-rendering the entire table
        for (const [name, process] of Object.entries(allProcesses)) {
            const row = document.querySelector(`tr[data-process-name="${name}"]`);
            if (!row) continue;
            
            const cpuUsage = process.metrics?.cpu_percent || 0;
            const memUsage = process.metrics?.memory_mb || 0;
            
            // Update CPU
            const cpuCell = row.querySelector('td:nth-child(5)');
            if (cpuCell) {
                cpuCell.textContent = `${cpuUsage}%`;
            }
            
            // Update Memory
            const memCell = row.querySelector('td:nth-child(6)');
            if (memCell) {
                memCell.textContent = `${memUsage} MB`;
            }
        }
    }

    let metricsInterval = null;

    function startMetricsPolling() {
        if (metricsInterval) {
            return;
        }
        metricsInterval = setInterval(fetchProcessMetrics, 5000);
    }

    function stopMetricsPolling() {
        if (!metricsInterval) {
            return;
        }
        clearInterval(metricsInterval);
        metricsInterval = null;
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopMetricsPolling();
            return;
        }

        fetchProcessMetrics();
        startMetricsPolling();
    });

    // Fetch metrics every 5 seconds while tab is visible
    startMetricsPolling();
    // Initial fetch after 1 second
    setTimeout(fetchProcessMetrics, 1000);
    updateSortHeaders();
</script>
{% endblock content %}
