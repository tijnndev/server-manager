{% extends 'process/process_layout.html' %}

{% block process_content %}
<div class="stack">
    <section class="panel">
        <div class="panel-toolbar">
            <span class="panel-label">New account</span>
        </div>
        <div class="panel-body">
            <form id="create-email-form">
                <input type="hidden" name="action" value="create">
                <div class="form-grid">
                    <div>
                        <label for="email" class="form-label">Email</label>
                        <input type="text" name="email" id="email" class="form-control" required>
                    </div>
                    <div>
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" name="password" id="password" class="form-control" required>
                            <button type="button" class="btn btn-outline-secondary" onclick="generatePassword()">Generate</button>
                        </div>
                    </div>
                </div>
                <div class="mt-3" id="generated-password-container" style="display: none;">
                    <label for="generated-password" class="form-label">Generated password</label>
                    <input type="text" id="generated-password" class="form-control" onclick="copyGeneratedPassword()" readonly>
                </div>
                <div class="mt-3">
                    <button type="button" class="btn btn-primary btn-sm" onclick="createEmail()">Add account</button>
                </div>
            </form>
        </div>
    </section>

    <section class="panel">
        <div class="panel-toolbar">
            <span class="panel-label">Accounts</span>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="loadEmailAccounts()">Refresh</button>
        </div>
        <div class="table-responsive">
            <table class="table table-dense mb-0">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="email-accounts-tbody">
                    <tr class="skeleton-row">
                        <td><div class="skeleton skeleton-text" style="width: 240px;"></div></td>
                        <td><div class="skeleton skeleton-button" style="width: 160px;"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="panel-body d-none" id="email-load-error">
            <div class="alert alert-danger mb-0">Failed to load email accounts.</div>
        </div>
    </section>
</div>

<div class="modal fade" tabindex="-1" id="editPasswordModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit password</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="edit-password-form">
                    <div class="mb-3">
                        <label for="email-modal" class="form-label">Email</label>
                        <input type="text" id="email-modal" class="form-control" disabled readonly>
                    </div>
                    <div class="mb-3">
                        <label for="new-password" class="form-label">New password</label>
                        <input type="password" id="new-password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">Confirm</label>
                        <input type="password" id="confirm-password" class="form-control" required>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="closeEditPasswordModal()">Cancel</button>
                        <button type="button" class="btn btn-primary btn-sm" onclick="updatePassword()">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
const processName = "{{ process.name }}";

function renderEmailAccounts(users) {
    const tbody = document.getElementById('email-accounts-tbody');
    const errorBox = document.getElementById('email-load-error');
    errorBox.classList.add('d-none');
    tbody.innerHTML = '';

    if (!users || users.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 2;
        td.className = 'text-muted py-3';
        td.textContent = 'No email accounts yet.';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
    }

    const fragment = document.createDocumentFragment();
    users.forEach((userEmail) => {
        const tr = document.createElement('tr');
        const emailTd = document.createElement('td');
        emailTd.textContent = userEmail;

        const actionsTd = document.createElement('td');
        actionsTd.className = 'text-end';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-outline-secondary me-1';
        editBtn.textContent = 'Password';
        editBtn.addEventListener('click', () => editPassword(userEmail));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-sm btn-outline-danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => deleteEmail(userEmail));

        actionsTd.appendChild(editBtn);
        actionsTd.appendChild(deleteBtn);
        tr.appendChild(emailTd);
        tr.appendChild(actionsTd);
        fragment.appendChild(tr);
    });

    tbody.appendChild(fragment);
}

function renderEmailLoadError(message) {
    const errorBox = document.getElementById('email-load-error');
    errorBox.classList.remove('d-none');
    errorBox.querySelector('.alert').textContent = message;
}

async function loadEmailAccounts() {
    try {
        const response = await fetch(`/email/${processName}/api/accounts`);
        const data = await response.json();
        if (!response.ok || !data.success) {
            renderEmailLoadError(data.error || 'Failed to load email accounts.');
            return;
        }
        renderEmailAccounts(data.users || []);
    } catch (error) {
        console.error('Error loading email accounts:', error);
        renderEmailLoadError('Error while loading email accounts.');
    }
}

function generatePassword() {
    const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+";
    let password = "";
    for (let i = 0; i < 16; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
    }
    document.getElementById("password").value = password;
    const container = document.getElementById("generated-password-container");
    const displayField = document.getElementById("generated-password");
    displayField.value = password;
    container.style.display = "block";
}

function copyGeneratedPassword() {
    const tempInput = document.createElement("input");
    tempInput.value = document.getElementById("generated-password").value;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand("copy");
    document.body.removeChild(tempInput);
    alert("Password copied to clipboard!");
}

function createEmail() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    if (!email || !password) {
        alert("Email and password are required.");
        return;
    }
    fetch(`/email/{{ process.name }}/create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.message) {
            alert(data.message);
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
            document.getElementById("generated-password-container").style.display = "none";
            loadEmailAccounts();
        } else if (data.error) {
            alert(`Error: ${data.error}`);
        }
    })
    .catch(err => {
        console.error(err);
        alert("An error occurred while creating the email.");
    });
}

function editPassword(email) {
    document.getElementById('email-modal').value = email;
    document.getElementById('new-password').value = '';
    document.getElementById('confirm-password').value = '';
    const modal = new bootstrap.Modal(document.getElementById('editPasswordModal'));
    modal.show();
}

function closeEditPasswordModal() {
    const modal = bootstrap.Modal.getInstance(document.getElementById('editPasswordModal'));
    if (modal) modal.hide();
}

function updatePassword() {
    const email = document.getElementById('email-modal').value;
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    if (!newPassword || !confirmPassword) {
        alert("Both new password and confirmation are required.");
        return;
    }
    if (newPassword !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }
    fetch(`/email/{{ process.name }}/update-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: newPassword })
    })
    .then(res => res.json())
    .then(data => {
        if (data.message) {
            alert(data.message);
            closeEditPasswordModal();
            loadEmailAccounts();
        } else if (data.error) {
            alert(`Error: ${data.error}`);
        }
    })
    .catch(err => {
        console.error(err);
        alert("An error occurred while updating the password.");
    });
}

function deleteEmail(email) {
    if (confirm(`Delete email account: ${email}?`)) {
        fetch(`/email/{{ process.name }}/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                alert(data.message);
                loadEmailAccounts();
            } else if (data.error) {
                alert(`Error: ${data.error}`);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("An error occurred while deleting the email.");
        });
    }
}

document.addEventListener('DOMContentLoaded', loadEmailAccounts);
</script>
{% endblock %}
