{% extends 'layout.html' %}

{% block content %}
<style>
    .settings-wrapper {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 1rem;
        align-items: start;
    }

    .settings-sidebar {
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: var(--bg-secondary);
        overflow: hidden;
        position: sticky;
        top: 64px;
    }

    .settings-sidebar .sidebar-header {
        padding: 0.65rem 0.85rem;
        border-bottom: 1px solid var(--border-color);
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .settings-sidebar .sidebar-links a {
        display: block;
        padding: 0.55rem 0.85rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13px;
        border-left: 2px solid transparent;
    }

    .settings-sidebar .sidebar-links a:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.02);
    }

    .settings-sidebar .sidebar-links a.active {
        color: var(--text-primary);
        border-left-color: var(--text-primary);
        background: transparent;
    }

    .settings-sidebar .sidebar-links a i,
    .settings-content-header i,
    .section-title i,
    .setting-label i {
        display: none;
    }

    .settings-content {
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: var(--bg-secondary);
        overflow: hidden;
    }

    .settings-content-header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border-color);
    }

    .settings-content-header h2 {
        font-size: 1rem;
        font-weight: 560;
        margin: 0;
        letter-spacing: -0.02em;
        color: var(--text-primary);
    }

    .settings-content-body {
        padding: 1rem;
    }

    .section-title {
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 0.35rem;
    }

    .section-description {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 1rem;
    }

    .settings-section + .settings-section {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border-color);
    }

    #sidebarToggle {
        display: none;
    }

    @media (max-width: 768px) {
        .settings-wrapper {
            grid-template-columns: 1fr;
        }
        .settings-sidebar {
            position: static;
        }
    }
</style>

<div class="page">
    <div class="page-head">
        <div>
            <h1 class="page-title">Settings</h1>
            <p class="page-subtitle">Host preferences and version control</p>
        </div>
    </div>

    <div class="settings-wrapper">
        <nav class="settings-sidebar" id="settingsSidebar">
            <div class="sidebar-header">Navigate</div>
            <div class="sidebar-links">
                {% if session["role"] == "admin" %}
                <a href="{{ url_for('settings.version_page') }}" class="{{ 'active' if page_title == 'Version Control' else '' }}">Version</a>
                {% endif %}
                <a href="{{ url_for('settings.preferences_page') }}" class="{{ 'active' if page_title == 'Preferences' else '' }}">Preferences</a>
            </div>
        </nav>

        <main class="settings-content">
            {% block settings_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
