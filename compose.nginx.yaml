services:
  panel:
    pid: host
    # Docker's default AppArmor profile denies signaling host processes; the
    # panel must SIGHUP the host nginx to apply domain configs.
    security_opt:
      - apparmor=unconfined
    volumes:
      - /etc/nginx/sites-available:/etc/nginx/sites-available
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled
      - /etc/letsencrypt:/etc/letsencrypt
      - /run/nginx.pid:/run/nginx.pid
      - /etc/nginx/mime.types:/etc/nginx/mime.types:ro
