name: roundcube

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.tijnn.dev
    domainname: tijnn.dev
    volumes:
      - ./maildata:/var/mail
      - ./mailstate:/var/mail-state
      - ./maillogs:/var/log/mail
      - ./config:/tmp/docker-mailserver
      - /etc/server-manager/mail-certs:/tmp/docker-mailserver/ssl:ro
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      ENABLE_IMAP: 1
      ENABLE_POP3: 0
      ENABLE_SPAMASSASSIN: 1
      ENABLE_CLAMAV: 1
      ENABLE_SMTPS: 1
      SMTP_ONLY: 0
      TLS_LEVEL: modern
      SSL_TYPE: manual
      SSL_CERT_PATH: /tmp/docker-mailserver/ssl/fullchain.pem
      SSL_KEY_PATH: /tmp/docker-mailserver/ssl/privkey.pem
      POSTMASTER_ADDRESS: postmaster@tijnn.dev
      OVERRIDE_HOSTNAME: mail.tijnn.dev
      ONE_DIR: 1
      DMS_DEBUG: 1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ss -lntp | grep -q ':993'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      mailnetwork:
        aliases:
          - mail.tijnn.dev

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    ports:
      - "8080:80"
    volumes:
      - ./roundcube-config.inc.php:/var/roundcube/config/imap.inc.php:ro
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.tijnn.dev
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mail.tijnn.dev
      ROUNDCUBEMAIL_SMTP_PORT: 465
      ROUNDCUBEMAIL_SMTP_USER: "%u"
      ROUNDCUBEMAIL_SMTP_PASSWORD: "%p"
      ROUNDCUBEMAIL_SMTP_AUTH_TYPE: LOGIN
      ROUNDCUBEMAIL_REQUEST_PATH: /roundcube/
    depends_on:
      mailserver:
        condition: service_healthy
    restart: always
    networks:
      - mailnetwork

networks:
  mailnetwork:
    driver: bridge
